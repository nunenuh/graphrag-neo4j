[tool.poetry]
name = "graphrag-service"
version = "0.1.0"
description = "Graph RAG over Papers With Code data using Neo4j"
authors = ["Lalu Erfandi Maula Yusnu <nunenuh@gmail.com>"]
packages = [
    { include = "graphrag_service", from = "src" }
]

[tool.poetry.scripts]
start = "graphrag_service.main:main"
dev = "graphrag_service.main:dev"
cli = "graphrag_service.cli.main:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
# Database
neo4j = "^6.1.0"
neomodel = "^6.1.0"
# AI / ML (LangChain provider-agnostic)
langchain-core = "^1.2.17"
langgraph = "^1.0.10"
langchain-openai = "^1.1.10"
# Utilities
tqdm = "^4.66.4"
structlog = "^24.1.0"
psutil = "^7.0.0"
# CLI
typer = {extras = ["all"], version = "^0.12.0"}
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
pytest-bdd = ">=7.0"
pytest-mock = ">=3.12"
httpx = ">=0.27"
black = ">=24.1"
isort = ">=5.13"
flake8 = ">=7.0"
mypy = ">=1.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["graphrag_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
